name: world-data

on:
  schedule:
    - cron: "0 3 5 * *"
  workflow_dispatch:
    inputs:
      cities:
        description: "Пересобрать и cities.json (CHELSA, ~30–40 мин)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: world-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Countries → data/world/indicators.json
        run: uv run --no-project python scripts/build_countries.py

      - name: Cities → data/world/cities.json
        if: ${{ inputs.cities }}
        run: uv run --no-project --with rasterio --with tzdata python scripts/build_cities.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/world
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update world data"
          git push
