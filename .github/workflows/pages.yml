name: Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [world-data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: node --test tests/*.test.mjs
      - name: Collect site
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js schema.json css js vendor icons data _site/
          touch _site/.nojekyll
      - name: Stamp the offline copy with the site's content
        run: |
          STAMP=$(cd _site && find . -type f ! -path ./sw.js -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          export STAMP
          perl -pi -e 's/^const VERSION = "([^"]+)";/const VERSION = "$1-$ENV{STAMP}";/' _site/sw.js
          grep -q "^const VERSION = \"wtl-.*-${STAMP}\";" _site/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
